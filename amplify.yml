version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use nvm to switch to Node 22
        - nvm install 22
        - nvm use 22
        - npm install -g bun
        - bun install --frozen-lockfile
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
