version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm install -g bun
        - bun install --frozen-lockfile
    build:
      commands:
        - env | grep -E '^(SUPABASE_|VITE_|DEVELOPER_INVITE_CODE)' > .env
        - NITRO_PRESET=aws-amplify bun run build
        - ls -la .amplify-hosting
        - cat .amplify-hosting/deploy-manifest.json
        - cp .env .amplify-hosting/compute/default/.env
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*